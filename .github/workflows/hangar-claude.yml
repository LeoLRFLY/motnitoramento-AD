# Instalado pelo Hangar LRFLY (hangar-v2): o Claude trabalha nos pedidos feitos pelo painel
name: Claude (Hangar)
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
jobs:
  claude:
    if: >-
      github.actor == 'LeoLRFLY' && (
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: modelo
        name: Escolhe o modelo pela etiqueta do pedido
        env:
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          M=claude-sonnet-5-5
          case "$LABELS" in
            *'"ia:fable"'*) M=claude-fable-5-1 ;;
            *'"ia:opus"'*) M=claude-opus-5-5 ;;
            *'"ia:haiku"'*) M=claude-haiku-4-5-20251001 ;;
          esac
          echo "Modelo: $M"
          echo "model=$M" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model ${{ steps.modelo.outputs.model }} --allowedTools "Bash(curl:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(ls:*),Bash(mkdir:*)"'
